<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trascrizione live</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1c1c1e; --muted: #6b6b70; --card: #ffffff;
    --border: #d8d8dc; --accent: #2563eb; --accent-fg: #ffffff;
    --warn-bg: #fff4d6; --warn-fg: #6b4a00; --bar: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --fg: #ececee; --muted: #9a9aa1; --card: #1f1f22;
      --border: #3a3a40; --accent: #3b82f6; --accent-fg: #ffffff;
      --warn-bg: #4a3a10; --warn-fg: #ffe7a3; --bar: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  select, input, textarea { width: 100%; padding: 7px 9px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  textarea { resize: vertical; min-height: 56px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  button { font: inherit; padding: 8px 18px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
    font-weight: 600; min-width: 110px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #status { flex: 1; min-width: 160px; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter { width: 120px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  #level { height: 100%; width: 0; background: var(--bar); transition: width 0.15s; }
  #banner { background: var(--warn-bg); color: var(--warn-fg); padding: 10px 12px;
    border-radius: 8px; margin-bottom: 14px; }
  #log { height: 380px; overflow-y: auto; }
  .par { margin: 0 0 10px; }
  .par b { margin-right: 6px; font-variant-numeric: tabular-nums; }
  #current { color: var(--muted); font-style: italic; margin: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Trascrizione live</h1>

  <div class="card">
    <div class="grid">
      <div>
        <label for="model">Modello</label>
        <select id="model">
          <option value="small" selected>small</option>
          <option value="medium">medium</option>
          <option value="large-v3-turbo">large-v3-turbo</option>
        </select>
        <div class="hint">Su CPU <code>small</code> regge il tempo reale; <code>medium</code> può restare indietro.</div>
      </div>
      <div>
        <label for="source">Sorgente audio</label>
        <select id="source">
          <option value="mic" selected>Microfono</option>
          <option value="tab">Scheda del browser</option>
          <option value="both">Entrambi (scheda + microfono)</option>
        </select>
        <div class="hint" id="source-hint"></div>
        <div class="hint hidden" id="support-note">Disponibile solo in Chrome/Edge.</div>
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div>
        <label for="title">Titolo (opzionale)</label>
        <input id="title" type="text" maxlength="80">
      </div>
      <div>
        <label for="glossary">Glossario (opzionale)</label>
        <textarea id="glossary" maxlength="600" placeholder="termini tecnici, nomi, sigle separati da virgola"></textarea>
      </div>
    </div>
  </div>

  <div class="card row">
    <button id="toggle" class="primary">Avvia</button>
    <span id="status">Pronto</span>
    <span id="timer">00:00:00</span>
    <div class="meter" title="Livello audio"><div id="level"></div></div>
  </div>

  <div id="banner" class="hidden"></div>

  <div class="card">
    <div id="log"><p id="current"></p></div>
  </div>

  <div class="row">
    <button id="copy">Copia testo</button>
    <button id="open-folder" class="hidden">Apri cartella</button>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
